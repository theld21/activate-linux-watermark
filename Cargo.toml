[package]
default-run = "activate-linux-watermark"
name = "activate-linux-watermark"
version = "0.1.8"
edition = "2021"
description = "A Windows-style \"Activate Linux\" watermark for your desktop"
license = "MIT"
repository = "https://github.com/theld21/activate-linux-watermark"
authors = ["theld21 <thedev.ldt@gmail.com>"]

[dependencies]
x11rb = { version = "0.13", features = ["shape", "randr"] }
fontdue = "0.9"
gtk4 = "0.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
depends = "libc6, fontconfig, libgtk-4-1, pkexec | policykit-1"
license-file = ["LICENSE", "0"]
maintainer-scripts = "debian/"
assets = [
  ["target/release/activate-linux-watermark", "usr/bin/", "755"],
  ["target/release/activate-linux-watermark-settings", "usr/bin/", "755"],
  ["activate-linux-watermark.desktop", "etc/xdg/autostart/", "644"],
  ["io.github.theld21.ActivateLinuxWatermark.desktop", "usr/share/applications/", "644"],
  ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/io.github.theld21.ActivateLinuxWatermark.svg", "644"],
]

[package.metadata.generate-rpm]
pre_uninstall_script = "pkill -f '^(/usr/bin/)?activate-linux-watermark$' || true"
assets = [
  { source = "target/release/activate-linux-watermark", dest = "/usr/bin/activate-linux-watermark", mode = "755" },
  { source = "target/release/activate-linux-watermark-settings", dest = "/usr/bin/activate-linux-watermark-settings", mode = "755" },
  { source = "io.github.theld21.ActivateLinuxWatermark.desktop", dest = "/usr/share/applications/io.github.theld21.ActivateLinuxWatermark.desktop", mode = "644" },
  { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.theld21.ActivateLinuxWatermark.svg", mode = "644" },
  { source = "activate-linux-watermark.desktop", dest = "/etc/xdg/autostart/activate-linux-watermark.desktop", mode = "644" },
]
[package.metadata.generate-rpm.requires]
fontconfig = "*"
gtk4 = "*"
polkit = "*"
